name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Validar build
        run: npm run build
