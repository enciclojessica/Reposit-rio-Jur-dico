    <title>Themis Jur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Auto-recuperação: se o app não montar em 8s, limpa SW e caches e recarrega
      (function() {
        var montou = false;
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.children.length === 0 && !montou) {
              // App não montou — provável SW/cache corrompido
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              if (window.caches) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).then(function() {
                  if (!sessionStorage.getItem('recarregou')) {
                    sessionStorage.setItem('recarregou', '1');
                    location.reload(true);
                  }
                });
              }
            } else {
              montou = true;
              sessionStorage.removeItem('recarregou');
            }
          }, 8000);
        });
      })();
    </script>
  </body>
</html>
